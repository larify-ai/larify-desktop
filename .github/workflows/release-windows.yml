name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content apps/larify/package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match apps/larify version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Ensure public release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api "repos/larify-ai/larify-desktop/git/ref/tags/${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $sha = gh api repos/larify-ai/larify-desktop/git/ref/heads/main --jq '.object.sha'
            gh api --method POST repos/larify-ai/larify-desktop/git/refs -f ref="refs/tags/${{ github.ref_name }}" -f sha=$sha
          }

      - name: Build and publish Windows release
        run: npm run release:win --workspace apps/larify
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Trigger CNB release sync
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if (-not $env:CNB_TOKEN) {
            throw 'GitHub Actions secret CNB_TOKEN is not configured'
          }

          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("cnb:$env:CNB_TOKEN")
          )
          $gitAuth = "http.extraHeader=AUTHORIZATION: basic $auth"
          $repo = 'https://cnb.cool/larify-ai/larify-desktop'
          $tag = '${{ github.ref_name }}'

          git clone --depth 1 $repo cnb-release
          Set-Location cnb-release

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git -c $gitAuth ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "CNB tag $tag already exists; nothing to do."
            exit 0
          }

          git tag -a $tag -m "Release $tag"
          git -c $gitAuth push origin "refs/tags/$tag"
